services:
  postgres-order-db:
    image: postgres:18.6-alpine
    container_name: order-integration-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - order_prod_db_data:/var/lib/postgresql
    networks:
      - order-integration-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      start_period: 180s
      retries: 12

  order-api:
    image: ${DOCKERHUB_USERNAME}/order-integration-api:${API_IMAGE_TAG}
    container_name: order-integration-prod-api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres-order-db
      POSTGRES_PORT: 5432
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
      SPRING_DATA_REDIS_USERNAME: ${SPRING_DATA_REDIS_USERNAME}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      SPRING_DATA_REDIS_SSL_ENABLED: ${SPRING_DATA_REDIS_SSL_ENABLED}
      MONGODB_URI: ${MONGODB_URI}
      N8N_RECONCILIATION_WEBHOOK_URL: http://n8n-order:5678/webhook/v1/notifications/reconciled
    networks:
      - order-integration-internal
    depends_on:
      postgres-order-db:
        condition: service_healthy
      n8n-order:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  n8n-order:
    image: n8nio/n8n:2.36.7
    container_name: order-integration-prod-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: ${N8N_WEBHOOK_URL}
      N8N_SECURE_COOKIE: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      TRUST_PROXY: "true"
      N8N_PROXY_HOPS: 1
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      ORDER_API_INTERNAL_URL: http://order-api:8080
      ORDER_API_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MONGODB_URI: ${MONGODB_URI}
      UPSTASH_REDIS_URL: ${UPSTASH_REDIS_URL}
    volumes:
      - n8n_prod_data:/home/node/.n8n
    networks:
      - order-integration-edge
      - order-integration-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  nginx-order:
    image: nginx:1.29.1-alpine
    container_name: order-integration-prod-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    networks:
      - order-integration-edge
      - order-integration-internal
    depends_on:
      order-api:
        condition: service_healthy
      n8n-order:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ngrok-order:
    image: ngrok/ngrok@sha256:14d80d083e5b53145f416bbbd36238336c9de4016c43fd950eb2eb845670583b
    container_name: order-integration-prod-ngrok
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - http
      - --url=${NGROK_DOMAIN}
      - nginx-order:80
    networks:
      - order-integration-edge
    depends_on:
      nginx-order:
        condition: service_healthy

volumes:
  order_prod_db_data:
  n8n_prod_data:

networks:
  order-integration-edge:
  order-integration-internal:
