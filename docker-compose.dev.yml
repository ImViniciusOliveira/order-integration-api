services:
  postgres-order-db:
    image: postgres:alpine
    container_name: order-integration-db
    restart: no
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - order_db_data:/var/lib/postgresql
    networks:
      - order-integration-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb-order:
    image: mongo:latest
    container_name: order-integration-mongodb
    restart: no
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_order_data:/data/db
    networks:
      - order-integration-network

  redis-order:
    image: redis:alpine
    container_name: order-integration-redis
    restart: no
    ports:
      - "6379:6379"
    volumes:
      - redis_order_data:/data
    networks:
      - order-integration-network

  redis-insight:
    image: redis/redisinsight:latest
    container_name: order-integration-redis-insight
    restart: no
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data
    networks:
      - order-integration-network
    depends_on:
      - redis-order

  prometheus-order:
    image: prom/prometheus:latest
    container_name: order-integration-prometheus
    restart: no
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_order_data:/prometheus
    networks:
      - order-integration-network

  grafana-order:
    image: grafana/grafana:latest
    container_name: order-integration-grafana
    restart: no
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_order_data:/var/lib/grafana
    networks:
      - order-integration-network
    depends_on:
      - prometheus-order

  n8n-order:
    image: n8nio/n8n:latest
    container_name: order-integration-n8n
    restart: no
    ports:
      - "5679:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - TRUST_PROXY=true
      - N8N_PROXY_HOPS=1
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
    volumes:
      - n8n_order_data:/home/node/.n8n
    networks:
      - order-integration-network

  ngrok-order:
    image: ngrok/ngrok:latest
    container_name: order-integration-ngrok
    restart: no
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--url=${NGROK_DOMAIN}"
      - "n8n-order:5678"
    networks:
      - order-integration-network
    depends_on:
      - n8n-order

  sonarqube-order:
    image: sonarqube:lts-community
    container_name: order-integration-sonarqube
    restart: no
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - order-integration-network

  order-api:
    build: .
    container_name: order-integration-api
    restart: no
    env_file:
      - .env.dev
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-order-db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis-order
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_FLYWAY_ENABLED=true
      - ESCROW_REDIS_QUEUE_KEY=${ESCROW_REDIS_QUEUE_KEY}
      - ESCROW_DELAY_MINUTES=${ESCROW_DELAY_MINUTES}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - N8N_RECONCILIATION_WEBHOOK_URL=${N8N_RECONCILIATION_WEBHOOK_URL}
    networks:
      - order-integration-network
    depends_on:
      postgres-order-db:
        condition: service_healthy
      redis-order:
        condition: service_started

volumes:
  order_db_data:
  n8n_order_data:
  mongodb_order_data:
  redis_order_data:
  redis_insight_data:
  prometheus_order_data:
  grafana_order_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  order-integration-network:
    driver: bridge
