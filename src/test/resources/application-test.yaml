spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_integration_db
    driver-class-name: org.postgresql.Driver
    username: order_db_user
    password: order_db_pass
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379

springdoc:
  enable-hateoas: false

order-integration:
  cors:
    allowed-origins: http://localhost:8081
  security:
    internal-api-key: test-internal-key
  redis:
    escrow-queue-key: dcriar:orders:escrow_delay_queue
  escrow:
    delay-minutes: 120
    retry-delay-minutes: 30
    worker-interval-ms: 60000
    batch-size: 50
    max-retries: 5
  notification:
    n8n-reconciliation-webhook-url: http://localhost:5678/webhook/v1/notifications/reconciled
