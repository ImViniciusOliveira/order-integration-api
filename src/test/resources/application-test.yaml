spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_integration_db
    driver-class-name: org.postgresql.Driver
    username: order_db_user
    password: order_db_pass
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
