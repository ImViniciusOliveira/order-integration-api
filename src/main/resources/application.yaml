spring:
  application:
    name: order-integration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  enable-hateoas: false

order-integration:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    internal-api-key: ${INTERNAL_API_KEY}
  redis:
    escrow-queue-key: ${ESCROW_REDIS_QUEUE_KEY}
  escrow:
    delay-minutes: ${ESCROW_DELAY_MINUTES}
    retry-delay-minutes: ${ESCROW_RETRY_DELAY_MINUTES}
    worker-interval-ms: ${ESCROW_WORKER_INTERVAL_MS}
    batch-size: ${ESCROW_BATCH_SIZE}
    max-retries: ${ESCROW_MAX_RETRIES}
  notification:
    n8n-reconciliation-webhook-url: ${N8N_RECONCILIATION_WEBHOOK_URL}
  shopee:
    base-url: ${SHOPEE_API_BASE_URL}
    escrow-path: ${SHOPEE_ESCROW_PATH}
  mercado-livre:
    base-url: ${MERCADO_LIVRE_API_BASE_URL}
    orders-path: ${MERCADO_LIVRE_ORDERS_PATH}
    shipments-path: ${MERCADO_LIVRE_SHIPMENTS_PATH}
    payments-path: ${MERCADO_LIVRE_PAYMENTS_PATH}
