spring:
  application:
    name: order-integration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  jpa:
    open-in-view: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  enable-hateoas: false

order-integration:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    internal-api-key: ${INTERNAL_API_KEY}
  redis:
    escrow-queue-key: ${ESCROW_REDIS_QUEUE_KEY}
  escrow:
    delay-minutes: ${ESCROW_DELAY_MINUTES}
    retry-delay-minutes: ${ESCROW_RETRY_DELAY_MINUTES}
    worker-interval-ms: ${ESCROW_WORKER_INTERVAL_MS}
    batch-size: ${ESCROW_BATCH_SIZE}
    max-retries: ${ESCROW_MAX_RETRIES}
  notification:
    n8n-reconciliation-webhook-url: ${N8N_RECONCILIATION_WEBHOOK_URL}
